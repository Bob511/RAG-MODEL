<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/stylesheet/cssLogin.css" />
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center align-items-center vh-100">
        <div
          id="form-box"
          class="col-11 col-sm-8 col-md-6 col-lg-4 shadow-sm p-4 p-md-5"
        >
          <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Chào mừng trở lại</h2>
            <p class="text-secondary small">
              Vui lòng nhập thông tin để đăng nhập
            </p>
          </div>

          <!-- Tài khoản -->
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="Tài khoản"
            />
            <label class="text-secondary" for="username">Tài khoản</label>
          </div>

          <!-- Mật khẩu -->
          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Mật khẩu"
            />
            <label class="text-secondary" for="password">Mật khẩu</label>
          </div>

          <!-- Ghi nhớ & Quên mật khẩu (Thêm cho giống app thật) -->
          <div class="d-flex justify-content-between mb-4 small">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">Ghi nhớ</label>
            </div>
            <a href="/login" class="text-decoration-none">Quên mật khẩu?</a>
          </div>

          <!-- Nút Đăng nhập -->
          <div class="d-grid">
            <button
              class="btn btn-primary btn-login text-white"
              onclick="login()"
            >
              Đăng Nhập
            </button>
          </div>

          <!-- Link đăng ký -->
          <p class="text-center mt-4 mb-0 small">
            Chưa có tài khoản?
            <a href="/register" class="text-decoration-none fw-bold"
              >Đăng ký ngay</a
            >
          </p>
        </div>
      </div>
    </div>
    <script>
      async function login() {
        try {
          const usernameEl = document.getElementById("username");
          const passwordEl = document.getElementById("password");
          const username = usernameEl.value.trim();
          const password = passwordEl.value.trim();

          if (!username || !password) {
            alert("Thiếu tham số đầu vào!");
            return;
          }
          const response = await fetch("/users/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();
          if (data.status == "fail") {
            alert("Đăng nhập không thành công!");
            usernameEl.value = "";
            passwordEl.value = "";
          } else {
            alert("Đăng nhập thành công!");
            window.location.href = "/";
          }
        } catch (error) {
          console.error("Lỗi kết nối server!");
        }
      }
    </script>
  </body>
</html>
