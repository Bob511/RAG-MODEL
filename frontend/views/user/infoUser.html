<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background: rgb(32, 132, 239);
        justify-content: center;
        height: 600px;
        width: auto;
        padding: 30px;
      }
      .box-form {
        box-shadow: 0 0 300px black;
        margin: 40px;
        margin: 0 auto;
        border-radius: 10px;
        background: linear-gradient(
          to right,
          rgb(66, 135, 209),
          rgb(253, 253, 253)
        );
        background-color: lavender;
        height: 600px;
        width: 600px;
        border-radius: 2px solid black;
        padding: 10px;
        display: block;
      }
      .title {
        font-size: 34px;
        color: rgb(30, 154, 185);
        text-align: center;
        justify-content: center;
      }
      .box-show {
        display: flex;
        margin: 0 auto;
        margin: 5;
        margin-top: 0px;
        border-radius: 10px;
        border: 2px solid black;
        background-color: rgb(255, 255, 255);
        width: 300px;
        height: 40px;
      }
      .title-show {
        color: rgb(30, 154, 185);
        text-align: center;
        margin: 10px;
      }
      .box-avt {
        justify-content: center;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div th:replace="~{header/header}"></div>
    <span style="justify-content: center; margin: 20px">
      <div class="box-form">
        <div class="title"><p>Thông tin người dùng</p></div>
        <div class="box-avt">
          <img
            style="height: 80px; width: auto"
            th:src="@{/avt.png}"
            alt="avt"
          />
        </div>
        <h3 class="title-show">Tài khoản</h3>
        <input class="box-show" type="text" th:value="${username}" disabled />
        <h3 class="title-show">Mật khẩu</h3>
        <input class="box-show" type="text" th:value="${password}" disabled />
        <h3 class="title-show">Email</h3>
        <input class="box-show" type="text" th:value="${email}" disabled />
        <div th:if="${username == 'khách'}">
          <script>
            alert("Chưa Đăng nhập");
            // window.location.href = "/login";
          </script>
        </div>
      </div>
    </span>

    <div th:replace="~{footer/footer}"></div>
  </body>
</html>
