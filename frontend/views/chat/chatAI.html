<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      import "dotenv/config";
    </script>
    <title>Document</title>
    <style>
      body {
        background: black;
        height: 100vh;
        padding: 0;
        margin: 0;
        display: flex;
      }
      .navigation-bar {
        display: flex;
        flex-direction: column; /* Xếp theo chiều dọc */
        background-color: rgb(47, 42, 42);
        border-radius: 10px;
        padding: 10px;
        height: 100vh;
        width: 20%;
        box-sizing: border-box; /* Đảm bảo padding không làm tăng chiều rộng */
      }
      .box-title {
        justify-content: center;
      }
      .title {
        text-align: center;
        font-size: 30px;
        padding: 0;
        margin: 0;
      }
      #box-history {
        flex-grow: 1; /* Tự động chiếm khoảng trống ở giữa */
        width: 100%;
        overflow-y: auto; /* Thêm cuộn nếu lịch sử quá dài */
        margin-top: 10px;
      }
      #box-account {
        height: 60px; /* Cố định chiều cao phần tài khoản */
        width: 100%;
        display: flex;
        align-items: center;
        border-top: 1px solid #444; /* Thêm đường kẻ mờ ngăn cách */
        padding-top: 10px;
      }

      .show-account {
        display: flex;
        align-items: center;
        width: 100%;
        color: white; /* Thêm dòng này để hiện chữ */
      }

      .avatar {
        background-color: #777; /* Thêm màu nền để thấy hình tròn khi chưa có ảnh */
        border-radius: 50%;
        height: 40px;
        width: 40px;
        flex-shrink: 0; /* Không cho avatar bị bóp méo */
      }

      .name-account {
        margin-left: 10px;
        font-family: sans-serif;
        font-size: 14px;
        text-align: left; /* Căn trái cho tự nhiên */
      }
      .name-account {
        width: 60%;
        text-align: center;
      }
      .history {
        background-color: #3d3d3d; /* Thêm màu nền nhẹ */
        color: #ccc; /* Màu chữ xám trắng */
        border-radius: 8px;
        margin: 5px auto;
        width: 90%;
        padding: 10px;
        border: 1px solid #555;
        font-size: 13px;
      }
      /* 1. Kích thước tổng thể của thanh cuộn */
      #box-history::-webkit-scrollbar,
      .message::-webkit-scrollbar {
        width: 8px; /* Độ rộng thanh cuộn */
      }

      /* 2. Phần nền của thanh cuộn (Track) */
      #box-history::-webkit-scrollbar-track,
      .message::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1); /* Màu nền mờ */
        border-radius: 10px;
      }

      /* 3. Phần tay kéo (Thumb) */
      #box-history::-webkit-scrollbar-thumb,
      .message::-webkit-scrollbar-thumb {
        background: #555; /* Màu của tay kéo */
        border-radius: 10px; /* Bo góc tròn trịa */
        border: 2px solid transparent; /* Tạo khoảng trống nhỏ quanh tay kéo */
        background-clip: content-box;
      }

      /* 4. Hiệu ứng khi di chuột vào tay kéo */
      #box-history::-webkit-scrollbar-thumb:hover,
      .message::-webkit-scrollbar-thumb:hover {
        background: #209da5; /* Đổi sang màu xanh giống nút New Chat của bạn */
      }
      /* Container bao quanh nút */
      .sidebar-header {
        padding: 15px;
        display: flex;
        justify-content: center;
      }

      /* Style cho nút */
      .btn-new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px; /* Khoảng cách giữa dấu + và chữ */

        width: 100%;
        max-width: 250px;
        padding: 12px 16px;

        background-color: #55595e; /* Màu xanh chủ đạo */
        color: white;
        font-size: 14px;
        font-weight: 500;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px; /* Bo góc hiện đại */
        cursor: pointer;
        transition: all 0.2s ease; /* Hiệu ứng mượt mà */
      }

      /* Hiệu ứng khi di chuột vào (Hover) */
      .btn-new-chat:hover {
        background-color: #209da5;
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        transform: translateY(-1px);
      }

      /* Hiệu ứng khi bấm vào (Active) */
      .btn-new-chat:active {
        transform: translateY(0);
      }

      /* Cái dấu cộng nhỏ phía trước */
      .icon {
        font-size: 18px;
        font-weight: bold;
      }

      .box-message {
        background: linear-gradient(
          to bottom,
          rgb(34, 33, 33),
          rgb(88, 83, 83)
        );
        height: auto;
        width: 100%;
        justify-content: center;
      }
      .message {
        margin-left: 5%;
        overflow-y: auto;
        height: 60%;
        width: 80%;
        padding: 5%;
      }
      /* Container bọc ngoài mỗi dòng tin nhắn */
      .message-row {
        display: flex;
        width: 100%;
        margin-bottom: 15px;
      }

      /* Khi là BOT: Căn trái (mặc định) */
      .message-row.bot {
        justify-content: flex-start;
      }
      .bot .message-item {
        background-color: #3d3d3d; /* Màu xám tối */
        color: white;
        border-bottom-left-radius: 2px; /* Bo góc kiểu tin nhắn chat */
      }

      /* Khi là USER: Căn phải */
      .message-row.user {
        justify-content: flex-end;
      }
      .user .message-item {
        background-color: #007bff; /* Màu xanh nổi bật */
        color: white;
        border-bottom-right-radius: 2px; /* Bo góc kiểu tin nhắn chat */
      }
      .message-item {
        max-width: 70%;
        padding: 12px 16px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        border-radius: 15px;
        word-wrap: break-word;
        position: relative;

        /* Nên thêm màu chữ và màu nền mặc định để không bị tàng hình trên nền đen */
        color: white;
        background-color: #333;

        /* Để các tin nhắn không dính sát vào nhau */
        margin-bottom: 10px;

        /* Giúp căn chỉnh text bên trong mượt hơn */
        display: inline-block;

        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .message-item:hover {
        filter: brightness(1.1);
        cursor: pointer; /* Thêm cái này để người dùng biết có thể tương tác */
      }
      .box-chat {
        justify-content: center;
        height: 20%;
        width: 60%;
        border-radius: 20px;
        margin-left: 20%;
        background: white;

        /* --- PHẦN THÊM MỚI --- */
        animation: bounce-box 2s ease-in-out infinite;
      }

      /* Định nghĩa quy luật nhảy */
      @keyframes bounce-box {
        0%,
        100% {
          transform: translateY(0); /* Vị trí ban đầu */
        }
        50% {
          transform: translateY(-20px); /* Nhảy lên cao 20px */
        }
      }

      .input-chat {
        width: 100%; /* Chiếm hết chiều ngang của .box-chat */
        height: 50%; /* Chiếm hết chiều cao của .box-chat */
        padding: 2% 5%; /* Cách lề trên dưới 2%, trái phải 5% cho thoáng */

        font-size: 16px;
        color: #333; /* Chữ màu xám đậm cho dễ đọc trên nền trắng */

        background: transparent; /* Để lộ nền trắng của .box-chat */
        border: none; /* Xóa viền mặc định của trình duyệt */
        outline: none; /* Xóa cái viền xanh khi bấm vào (focus) */

        box-sizing: border-box; /* Giữ nguyên kích thước dù có padding */

        transition: all 0.3s; /* Hiệu ứng mượt mà khi gõ hoặc click */
      }

      /* Hiệu ứng khi người dùng click vào để gõ */
      .input-chat:focus {
        background: rgba(
          0,
          0,
          0,
          0.02
        ); /* Hơi tối lại một chút cho chuyên nghiệp */
        font-size: 17px; /* Chữ to lên một tẹo tạo cảm giác phản hồi */
      }

      /* chuyển động thinking */
      .loader {
        max-width: 70%;
        padding: 12px 16px;
        position: relative;

        /* Giúp căn chỉnh text bên trong mượt hơn */
        display: flex;
      }
      .circle {
        border-radius: 50%;
        height: 10px;
        background-color: #0ae18b;
        width: 10px;
        position: absolute;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes new1 {
        0%,
        100% {
          transform: translateX(0px);
        }
        50% {
          transform: translateX(-10px);
        }
      }

      @keyframes new2 {
        0%,
        100% {
          transform: translateX(0px);
        }
        50% {
          transform: translateX(10px);
        }
      }

      @keyframes new3 {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(10px);
        }
      }

      @keyframes new4 {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }
    </style>
  </head>
  <body>
    <div class="navigation-bar">
      <div class="box-title">
        <h2 class="title">
          <a style="text-decoration: none" href="/">BIZ RAG 4</a>
        </h2>
      </div>
      <div class="sidebar-header">
        <button class="btn-new-chat" onclick="location.reload()">
          <span class="icon">+</span> Cuộc trò chuyện mới
        </button>
      </div>
      <div id="box-history"></div>
      <div id="box-account">
        <div class="show-account">
          <div id="avatar" class="avatar"></div>
          <div class="name-account"></div>
        </div>
      </div>
    </div>
    <div class="box-message">
      <div class="message">
        <div class="message-row bot">
          <div class="message-item">Chào bạn, tôi là AI!</div>
        </div>
      </div>
      <div class="box-chat">
        <textarea
          class="input-chat"
          type="text"
          placeholder="Nhập vào đây..."
          rows="1"
        ></textarea>
      </div>
    </div>
  </body>
  <script>
    let username = "tôi là : ";
    const content = document.querySelector(".input-chat");
    content.addEventListener("keydown", function (event) {
      if (event.key == "Enter") {
        if (event.shiftKey) {
          return;
        }
        event.preventDefault();
        const message = content.value.trim();

        if (message != "") {
          sendMessage(message);
          content.value = "";
        }
      }
    });
    let globalMessage = [
      { role: "system", content: "Bạn là AI do BIZ RAG 4 phát triển" },
      { role: "system", content: "Khi viết code thì dùng ``` để xuống dòng" },
      { role: "system", content: username },
      {
        role: "system",
        content:
          "Không được tùy tiện để tên file sau ```, chỉ nên để tên ngôn ngữ đang viết sau ```",
      },
    ];
    async function thinking(message) {
      const container = document.querySelector(".message");
      const message_row = document.createElement("div");
      message_row.classList.add("message-row", "bot");
      const loader = document.createElement("div");
      loader.classList.add("loader");

      for (let i = 1; i <= 4; i++) {
        const circle = document.createElement("div");
        circle.classList.add("circle");
        circle.style.animation = `new${i} 1s ease-in-out infinite`;

        loader.appendChild(circle);
      }
      message_row.appendChild(loader);
      container.appendChild(message_row);

      globalMessage.push({
        role: "user",
        content: message,
      });

      const response = nvidia(container, message_row, loader);

      if (response == null) {
        setTimeout(() => {
          loader.remove();
          let stringMessageFail = "Kết nối thất bại!";
          const fail = document.createElement("div");
          fail.classList.add("message-item");
          message_row.appendChild(fail);
          for (let i = 0; i < stringMessageFail.length; i++) {
            setTimeout(() => {
              fail.textContent += stringMessageFail[i];
            }, i * 10);
          }
        }, 4000);
      }
    }
    async function nvidia(container, message_row, loader) {
      try {
        const response = await fetch(
          "https://openrouter.ai/api/v1/chat/completions",
          {
            method: "POST",
            headers: {
              Authorization: `${process.env.API_KEY}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: "nvidia/nemotron-3-super-120b-a12b:free",
              messages: globalMessage, // Đảm bảo globalMessage đã được định nghĩa
              stream: true,
            }),
          },
        );

        if (!response.ok) {
          if (loader) loader.remove();
          alert("Lỗi kết nối: " + response.status);
          return null;
        }

        // 1. Tạo element hiển thị
        const message_bot = document.createElement("div");
        message_bot.classList.add("message-item");
        container.appendChild(message_bot);

        // 2. Thiết lập Reader
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullContent = "";
        let buffer = ""; // Cực kỳ quan trọng để xử lý stream bị cắt nửa chừng

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // Xóa loader ngay khi có dữ liệu đầu tiên đổ về
          if (loader) {
            loader.remove();
            loader = null;
          }

          // Giải mã chunk mới và cộng vào buffer
          buffer += decoder.decode(value, { stream: true });

          // SSE tách biệt các phần bằng dấu xuống dòng kép \n\n hoặc \n
          let lines = buffer.split("\n");

          // Giữ lại dòng cuối cùng trong buffer vì có thể nó chưa tải xong hoàn chỉnh
          buffer = lines.pop() || "";

          for (const line of lines) {
            const trimmedLine = line.trim();
            if (!trimmedLine || trimmedLine === "data: [DONE]") continue;

            if (trimmedLine.startsWith("data: ")) {
              try {
                const jsonStr = trimmedLine.replace("data: ", "");
                const data = JSON.parse(jsonStr);
                const content = data.choices[0]?.delta?.content || "";

                if (content) {
                  fullContent += content;

                  // 3. Hiển thị Markdown mượt mà
                  // Đảm bảo bạn đã nhúng thư viện marked.js
                  message_bot.innerHTML = marked.parse(fullContent);

                  // Tự động cuộn
                  container.scrollTop = container.scrollHeight;
                }
              } catch (e) {
                // Nếu parse lỗi, dòng này có thể bị cắt dở, đẩy ngược lại vào buffer
                buffer = trimmedLine + buffer;
              }
            }
          }
        }

        return fullContent;
      } catch (err) {
        console.error("Lỗi hệ thống:", err);
        if (loader) loader.remove();
        alert("Lỗi hệ thống: " + err.message);
        return null;
      }
    }

    async function messageAI(response, container, message_row) {
      const message = response.json();

      const message_bot = document.createElement("div");
      message_bot.classList.add("message-item");
      for (let i = 0; i < message.choices[0].message.content.length; i++) {
        setTimeout(() => {
          message_bot += message.message[i];
          message_row.appendChild(message_bot);
        }, i * 300);
      }
    }
    async function sendMessage(message) {
      const container = document.querySelector(".message");
      try {
        const message_user = document.createElement("div");
        message_user.classList.add("message-item");
        message_user.textContent = message;

        const message_row = document.createElement("div");
        message_row.classList.add("message-row", "user");

        message_row.appendChild(message_user);
        container.appendChild(message_row);

        container.scrollTop = container.scrollHeight;
        thinking(message);
      } catch (err) {
        console.error("Lỗi kết nối!");
      }
    }
    async function apiAI(message) {
      try {
        const response = await fetch("auth/AI", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message }),
        });

        if (!response.ok) {
          console.error("Lỗi không kết nối được tới AI!");
          return null;
        } else {
          return response;
        }
      } catch (err) {
        console.error("Lỗi kết nối!");
        return null;
      }
    }
    async function reload() {
      location.reload();
    }
    async function fetchHistory() {
      const box_history = document.getElementById("box-history");
      if (!box_history) return; // Kiểm tra xem element có tồn tại không

      // Xóa nội dung cũ để không bị cộng dồn mỗi lần load lại
      box_history.innerHTML = "";

      try {
        const response = await fetch("/auth/history", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        });

        // Nếu server lỗi (4xx, 5xx)
        if (!response.ok) {
          const errorDiv = document.createElement("div");
          errorDiv.classList.add("history");
          errorDiv.textContent = "Chưa có dữ liệu hoặc lỗi server!";
          box_history.appendChild(errorDiv);
          return;
        }

        const data = await response.json();

        // Duyệt qua mảng dữ liệu trả về (giả sử data là một mảng)
        if (data && data.length > 0) {
          data.forEach((item) => {
            const historyItem = document.createElement("div");
            historyItem.classList.add("history");

            // Tùy vào cấu trúc data của bạn, ví dụ: item.name, item.date...
            historyItem.textContent = `Giao dịch: ${item.amount} - ${item.date}`;

            box_history.appendChild(historyItem);
          });
        } else {
          box_history.innerHTML = "<div>Bạn chưa có lịch sử giao dịch.</div>";
        }
      } catch (err) {
        console.error("Lỗi kết nối!", err);
        box_history.innerHTML = "<div>Không thể kết nối đến máy chủ!</div>";
      }
    }
    fetchHistory();

    async function show_account() {
      const nameElement = document.querySelector("#box-account .name-account");

      try {
        const response = await fetch("/auth/accountChat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
        });

        if (!response.ok) {
          nameElement.textContent = "Chưa đăng nhập!";
        } else {
          const data = await response.json();
          nameElement.textContent = data.username;
          username += data.username;
        }
      } catch (err) {
        console.error("Không thể kết nối!");
      }
    }

    show_account();
  </script>
</html>
