services:
  # --- Dịch vụ Backend (Web1 - FastAPI) ---
  ai_api:
    build: 
      context: . 
      dockerfile: ai_api/backend/Dockerfile
    container_name: rag_ai_api
    depends_on:
      - chroma
    ports:
      - "8001:8000"
    volumes:
      - ./ai_api:/app
      - ./infrastructure/volumes/chroma_data:/data_json
      - ./infrastructure/volumes:/infrastructure/volumes
    working_dir: /app/backend
    env_file:
      - .env  # Nạp các biến môi trường cấu hình (như DATABASE_URL, GROQ_API_KEY)
    networks:
      - rag_network

  # --- Dịch vụ Database Vector ---
  chroma:
    image: chromadb/chroma:latest
    container_name: rag_chroma
    ports:
      - "8000:8000" 
    volumes:
      - ./infrastructure/volumes/chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma # Giữ lại cấu hình lưu dữ liệu vĩnh viễn
    networks:
      - rag_network

  # --- Dịch vụ Nạp dữ liệu (AI1 - Ingestion) ---
  ingestion:
    build: 
      context: .
      dockerfile: ingestion/Ingestion Main/Dockerfile
    container_name: rag_ingestion
    depends_on:
      - chroma
    volumes:
      - ./ingestion/Ingestion Main:/app
      - ./infrastructure/volumes:/infrastructure/volumes
    env_file:
      - .env
    networks:
      - rag_network

  # --- Dịch vụ Giao diện (Node.js - TV4) ---
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag_frontend
    ports:
      - "3000:3000"
    networks:
      - rag_network

  # --- Dịch vụ Gateway (Java - TV4) ---
  gateway:
    build:
      context: .
      dockerfile: java_gateway/Dockerfile
    container_name: rag_java_gateway
    ports:
      - "8080:8080"
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge