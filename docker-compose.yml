services:
  # --- Dịch vụ Backend (Web1) ---
  ai_api:
    build: 
      context: . 
      dockerfile: ai_api/backend/Dockerfile
    container_name: rag_ai_api
    depends_on:
      - chroma
    ports:
      - "8001:8000"
    volumes:
      - ./ai_api:/app
      - ./infrastructure/volumes/chroma_data:/data_json
      - ./infrastructure/volumes:/infrastructure/volumes
    
    working_dir: /app/backend
    networks:
      - rag_network

  # --- Dịch vụ Database Vector ---
  chroma:
    image: chromadb/chroma:latest
    container_name: rag_chroma
    volumes:
      - ./infrastructure/volumes/chroma_data:/chroma/chroma
    ports:
      - "8000:8000" 
    networks:
      - rag_network

  # --- Dịch vụ Nạp dữ liệu (AI1 - Ingestion) ---
  ingestion:
    build: 
      context: .
      dockerfile: ingestion/Ingestion Main/Dockerfile # Chỉ đúng đường dẫn Dockerfile
    container_name: rag_ingestion
    depends_on:
      - chroma
    volumes:
      - ./ingestion/Ingestion Main:/app
      - ./infrastructure/volumes:/infrastructure/volumes
    networks:
      - rag_network

# --- Dịch vụ Giao diện (Node.js - TV4) ---
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag_frontend
    ports:
      - "3000:3000" # Có thể đổi nếu TV4 cấu hình port khác
    networks:
      - rag_network

  # --- Dịch vụ Gateway (Java - TV4) ---
  gateway:
    build:
      context: .
      dockerfile: java_gateway/Dockerfile
    container_name: rag_java_gateway
    ports:
      - "8080:8080" # Có thể đổi nếu cổng Gateway TV4 quy định khác
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge